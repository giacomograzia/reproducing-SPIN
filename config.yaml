# Main configuration file for FACT AI reproducibility project

# Project metadata
project:
  name: "FACT-AI-Reproducibility"
  group: 23
  paper_title: "Paper Title Here"
  
# Paths
paths:
  data_dir: "data/"
  raw_data: "data/raw/"
  processed_data: "data/processed/"
  results_dir: "results/"
  models_dir: "results/models/"
  logs_dir: "results/logs/"

# Data settings
data:
  dataset_name: "dataset_name"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  seed: 42
  batch_size: 32
  num_workers: 4

# Model settings
model:
  architecture: "model_name"
  input_dim: 784
  hidden_dims: [256, 128, 64]
  output_dim: 10
  dropout: 0.2
  activation: "relu"

# Training settings
training:
  epochs: 100
  learning_rate: 0.001
  optimizer: "adam"
  scheduler: "step"
  step_size: 30
  gamma: 0.1
  early_stopping: true
  patience: 10
  checkpoint_freq: 10

# Fairness settings
fairness:
  sensitive_attributes: ["attr1", "attr2"]
  fairness_metric: "demographic_parity"
  fairness_threshold: 0.1

# Evaluation settings
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  fairness_metrics: ["demographic_parity", "equalized_odds"]

# Logging settings
logging:
  level: "INFO"
  use_tensorboard: true
  use_wandb: false
  wandb_project: "fact-ai-reproducibility"
  
# Reproducibility
reproducibility:
  seed: 42
  deterministic: true
  benchmark: false

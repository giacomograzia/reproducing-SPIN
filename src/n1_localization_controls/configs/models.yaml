# Model registry for n1_localization_controls.
#
# To add a new model: append one entry here (label, HF path, origin/unsuppressed
# baseline provenance), then follow README.md's "Adding a new model" checklist.
# No other file needs a model-specific edit outside this file + models.yaml
# itself -- every script resolves its model via `--model <label>` against this
# registry (see scripts/model_registry.py).
#
# Origin baselines are reused as static provenance records rather than
# recomputed per run: decoding is greedy (temperature=0), so these are
# seed-invariant.

models:
  qwen2-7b-instruct:
    path: Qwen/Qwen2-7B-Instruct
    origin_fairness: 0.715
    origin_privacy: 0.7671
    origin_source: src/output_spin/Origin_Qwen_18518261.out
    origin_decoding: "greedy (temperature=0, vLLM SamplingParams default in src/eval_salad.py)"
    origin_source_script: src/eval_origin.py
    origin_note: >
      Also the origin_fairness/origin_privacy defaults in
      reproduction/figures_and_tables/FT-data-scale/plot_results.py, confirming
      it is the repo's established origin-model baseline for Qwen2-7B-Instruct.

  mistral-7b-instruct-v0.2:
    path: mistralai/Mistral-7B-Instruct-v0.2
    origin_fairness: 0.6864
    origin_privacy: 0.7169
    origin_source: src/output_spin/Origin_Mistral_18518270.out
    origin_decoding: "greedy (temperature=0, vLLM SamplingParams default in src/eval_salad.py)"
    origin_source_script: src/eval_origin.py
    origin_note: >
      Cross-validated against a completed 3-seed multiseed run (all 3 seeds
      identical: fairness=0.6896, privacy=0.7154) -- higher confidence than
      Vicuna's single-run baseline. Also duplicated as a hardcoded constant in
      reproduction/figures_and_tables/baselines-table-1/results_dict.py
      (under the "Origin" -> "Mistral" key).

  vicuna-7b-v1.5:
    path: lmsys/vicuna-7b-v1.5
    origin_fairness: 0.6522
    origin_privacy: 0.4658
    origin_source: src/output_spin/Origin_Vicuna_18740218.out
    origin_decoding: "greedy (temperature=0, vLLM SamplingParams default in src/eval_salad.py)"
    origin_source_script: src/eval_origin.py
    origin_note: >
      Single-run provenance only (same confidence tier as Qwen's originally
      accepted single-run baseline). A 3-seed multiseed origin re-run attempt
      crashed on all 3 seeds with weight-loading errors (KeyError "filename
      'storages' not found" on seed0; FileNotFoundError incomplete-download
      blobs on seeds 1/2) -- unrelated to this pipeline's own code, so not
      cross-validated by a second independent run the way Mistral's is. Also
      duplicated as a hardcoded constant in
      reproduction/figures_and_tables/baselines-table-1/results_dict.py
      (under the "Origin" -> "Vicuna" key).

name: hellaswag_eval
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pytorch::pytorch=2.1.2
  - pytorch::pytorch-cuda=12.1
  - numpy<2.0
  - pandas
  - pyarrow
  - pip:
    - transformers>=4.36.0,<4.38.0
    - deepeval>=0.21.0
    - accelerate>=0.25.0
    - sentencepiece
    - protobuf
    - pytest-asyncio
    - safetensors>=0.4.0
    - tiktoken
    - einops
    - huggingface-hub>=0.19.0
    - datasets>=2.14.0
